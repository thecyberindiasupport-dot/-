<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Control Suite — Authenticate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-bg-grid"></div>
    <div class="login-glow-orb login-glow-orb-1"></div>
    <div class="login-glow-orb login-glow-orb-2"></div>

    <div class="login-container">
        <div class="brand-badge">
            <span class="status-pulse-dot"></span>
            <span>SYSTEM RESTRICTED</span>
        </div>

        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="logo">C2 <span>CENTRAL</span></h1>
            <p class="subtitle">Secure Device Management & Command Console</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Administrator Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="admin@c2console.net" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="password"><i class="fa-solid fa-key"></i> Master Key / Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
                    <button type="button" class="btn-toggle-pw" id="togglePassword" title="Toggle password visibility">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" checked>
                    <span>Keep session active</span>
                </label>
            </div>

            <button type="submit" id="loginBtn" class="btn-login">
                <span class="btn-text">Authenticate Session</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div id="errorMsg" class="error-msg"></div>
        </form>

        <div class="login-footer">
            <span><i class="fa-solid fa-circle-nodes"></i> Firebase RTDB & Storage Connected</span>
            <span class="version-tag">v2.5 PRO</span>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
